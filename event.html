<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event — PAMA · University of Lethbridge</title>
  <meta name="description" content="Details, time, place and what to bring for a PAMA event at the University of Lethbridge.">
  <meta name="theme-color" content="#04060c">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PAMA">
  <meta property="og:title" content="A PAMA event">
  <meta property="og:description" content="Talks, observing nights, workshops and socials — free and open to everyone.">
  <meta property="og:image" content="https://ulethpama.space/assets/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" as="image" href="assets/img/bg/pillars.jpg" fetchpriority="high">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/chrome.js"></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body id="top" data-theme="events">
  <site-header active="events"></site-header>

  <div class="page">
    <main id="main" data-event-page>

      <section class="page-hero" style="--gx: 74%; --gy: 40%">
        <div class="page-hero__bg" style="background-image:url('assets/img/bg/pillars.jpg')" aria-hidden="true"></div>
        <div class="container page-hero__grid">
          <div>
            <p class="eyebrow intro"><a class="back-link" href="events.html"><span class="i i-arrow" aria-hidden="true"></span><span>All events</span></a></p>
            <h1 class="h1 intro" style="--d:80ms" data-ev-title>Loading event…</h1>
            <p class="lead intro" style="--d:160ms" data-ev-lead></p>
            <div class="btn-row mt-m intro" style="--d:240ms" data-ev-actions></div>
          </div>
          <div class="page-hero__visual intro" style="--d:220ms" data-ev-pass></div>
        </div>
        <p class="page-hero__credit"><b>Pillars of Creation · Eagle Nebula (M16)</b> — NASA, ESA, CSA, STScI</p>
      </section>

      <section class="section" aria-labelledby="ev-about-title" data-ev-body>
        <div class="container">
          <div class="split">
            <div class="split__aside stack" style="--stack:1.25rem">
              <p class="eyebrow reveal"><span class="idx">01</span><span>Details</span></p>
              <h2 class="h2 reveal" id="ev-about-title">What to expect</h2>
            </div>
            <div class="ev-details" data-ev-details></div>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="ev-where-title" data-ev-where>
        <div class="container">
          <div class="split">
            <div class="split__aside stack" style="--stack:1.25rem">
              <p class="eyebrow reveal"><span class="idx">02</span><span>Getting there</span></p>
              <h2 class="h2 reveal" id="ev-where-title" data-ev-venue-title>Where to find us</h2>
            </div>
            <div data-ev-map></div>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="ev-more-title">
        <div class="container">
          <div class="section-head section-head--row">
            <div class="stack" style="--stack:1.25rem">
              <p class="eyebrow reveal"><span class="idx">03</span><span>Also coming up</span></p>
              <h2 class="h2 reveal" id="ev-more-title">More events</h2>
            </div>
            <a class="link reveal" href="events.html"><span>Full calendar</span> <span class="i i-arrow" aria-hidden="true"></span></a>
          </div>
          <div class="event-list reveal" data-ev-more></div>
        </div>
      </section>

    </main>
    <site-footer></site-footer>
  </div>
</body>
</html>
